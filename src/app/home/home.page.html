<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Moodley Auth</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ion-text-center">

  <div class="status-container">
    <img src="assets/icon/favicon.png" alt="Moodley" class="logo" />

    <ion-icon *ngIf="status === 'waiting'" name="log-in-outline" class="status-icon waiting"></ion-icon>
    <ion-spinner *ngIf="status === 'processing'" name="crescent" color="primary"></ion-spinner>
    <ion-icon *ngIf="status === 'success'" name="checkmark-circle" class="status-icon success" color="success"></ion-icon>
    <ion-icon *ngIf="status === 'error'" name="close-circle" class="status-icon error" color="danger"></ion-icon>

    <p class="message">{{ message }}</p>

    <ion-note *ngIf="status === 'waiting'" color="medium">
      Esta app intercepta automáticamente los enlaces <strong>moodley://</strong> de Moodle.
      No necesitas hacer nada más.
    </ion-note>
  </div>

</ion-content>

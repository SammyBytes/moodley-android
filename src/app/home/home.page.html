<ion-content [fullscreen]="true">
  <div class="wrapper">

    <!-- Header -->
    <div class="header">
      <div class="logo">🎓</div>
      <h1>Moodley Auth</h1>
      <p class="subtitle">Autenticación automática para UNAB</p>
    </div>

    <!-- Status card -->
    <div class="card" [class.card-success]="status === 'success'" [class.card-error]="status === 'error'">

      <div class="icon-area">
        <ion-spinner *ngIf="status === 'processing'" name="crescent" class="spinner"></ion-spinner>
        <span *ngIf="status === 'waiting'" class="status-emoji">⏸️</span>
        <span *ngIf="status === 'success'" class="status-emoji">✅</span>
        <span *ngIf="status === 'error'" class="status-emoji">❌</span>
      </div>

      <p class="status-label" [class.text-success]="status === 'success'" [class.text-error]="status === 'error'">
        {{ message }}
      </p>

      <p *ngIf="status === 'success'" class="countdown">
        Cerrando en {{ countdown }}s...
      </p>

    </div>

    <!-- Instructions when waiting -->
    <div *ngIf="status === 'waiting'" class="instructions">
      <p>Esta app intercepta automáticamente los tokens <code>moodlemobile://</code> de Moodle cuando inicias sesión desde Telegram.</p>
      <p>No necesitas abrirla manualmente.</p>
    </div>

    <!-- Footer with version -->
    <div class="footer">
      <span>v{{ version }}</span>
      <span class="sep">·</span>
      <span class="commit">{{ commit }}</span>
    </div>

  </div>
</ion-content>

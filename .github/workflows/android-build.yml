name: Android Build

on:
  push:
    branches: [main, nightly, develop]
  pull_request:
    branches: [main, nightly, develop]
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - nightly
          - production

concurrency:
  group: android-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Resolve build target
        id: target
        shell: bash
        run: |
          INPUT_TARGET="${{ github.event.inputs.target || 'auto' }}"
          REF_NAME="${{ github.ref_name }}"
          if [[ "$INPUT_TARGET" == "nightly" || "$INPUT_TARGET" == "production" ]]; then
            TARGET="$INPUT_TARGET"
          elif [[ "$REF_NAME" == "main" ]]; then
            TARGET="production"
          else
            TARGET="nightly"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Resolved target: $TARGET"

      - name: Build web app (nightly)
        if: steps.target.outputs.target == 'nightly'
        run: npm run build -- --configuration development

      - name: Build web app (production)
        if: steps.target.outputs.target == 'production'
        run: npm run build -- --configuration production

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK (nightly)
        if: steps.target.outputs.target == 'nightly'
        run: ./android/gradlew -p android assembleDebug

      - name: Assemble release APK (production)
        if: steps.target.outputs.target == 'production'
        run: ./android/gradlew -p android assembleRelease

      - name: Rename APK for release (nightly)
        if: steps.target.outputs.target == 'nightly'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk moodley-nightly.apk

      - name: Rename APK for release (production)
        if: steps.target.outputs.target == 'production'
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk moodley-production.apk

      - name: Get version from build.gradle
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create GitHub Release (nightly)
        if: steps.target.outputs.target == 'nightly' && github.event_name == 'push' && !contains(github.event_name, 'pull_request')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.sha }}
          name: "Nightly ${{ steps.version.outputs.version }} (${{ github.sha }})"
          body: |
            🌙 **Nightly build** — apunta al servidor de pruebas.

            Instala solo si sabes lo que estás haciendo.
          prerelease: true
          files: moodley-nightly.apk

      - name: Create GitHub Release (production)
        if: steps.target.outputs.target == 'production' && github.event_name == 'push' && !contains(github.event_name, 'pull_request')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.sha }}
          name: "Moodley Auth v${{ steps.version.outputs.version }}"
          body: |
            🚀 **Producción** — APK oficial de Moodley Auth.

            Descarga e instala en tu dispositivo Android.
          files: moodley-production.apk
